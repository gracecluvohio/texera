name: texera-liquibase
services:
  liquibase:
    image: liquibase/liquibase:4.29
    volumes:
      - .:/liquibase/sql
      - ./changelog.xml:/liquibase/changelog.xml
    # If you specified a different postgres username and password in storage.conf, make sure to change it here too
    # --username=[your postgres username] --password=[your postgres password]
    command: --url=jdbc:postgresql://host.docker.internal:5432/texera_db --username=postgres --password=postgres --changeLogFile=changelog.xml update